[project]
name = "pymed"
version = "0.9.0"
description = "PyMed is a Python library that provides access to PubMed through the PubMed API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest-cov>=7.0.0",
    "requests>=2.32.5",
]

[dependency-groups]
dev = ["pytest>=9.0.1", "ruff>=0.14.6"]


[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=pymed --cov-report=term-missing"
